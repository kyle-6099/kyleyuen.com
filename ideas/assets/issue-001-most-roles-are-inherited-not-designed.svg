<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>

  <!-- issue number top left -->
  <text x="120" y="170" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" fill="#6366f1">Issue 001</text>

  <!-- brand mark below issue number -->
  <g transform="translate(120, 210)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#1e3a8a"/>
    <text x="32" y="45" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="white">K°</text>
  </g>

  <!-- title lines -->
    <text x="120" y="520" font-family="Inter, sans-serif" font-size="88" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="white">Most</tspan>
      <tspan fill="white"> Roles</tspan>
      <tspan fill="white"> Are</tspan>
    </text>
    <text x="120" y="640" font-family="Inter, sans-serif" font-size="88" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#64748b">Inherited,</tspan>
      <tspan fill="white"> Not</tspan>
    </text>
    <text x="120" y="760" font-family="Inter, sans-serif" font-size="88" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="white">Designed</tspan>
    </text>

  <!-- accent line -->
  <line x1="120" y1="840" x2="420" y2="840" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>

  <!-- footer -->
  <text x="120" y="1120" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Kyle Yuen · kyleyuen.com/ideas</text>
</svg>