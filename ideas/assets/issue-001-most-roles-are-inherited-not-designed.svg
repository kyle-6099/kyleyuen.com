<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#e2e8f0" stroke-width="2">
    <line x1="150" y1="0" x2="150" y2="1200"/>
    <line x1="300" y1="0" x2="300" y2="1200"/>
    <line x1="450" y1="0" x2="450" y2="1200"/>
    <line x1="600" y1="0" x2="600" y2="1200"/>
    <line x1="750" y1="0" x2="750" y2="1200"/>
    <line x1="900" y1="0" x2="900" y2="1200"/>
    <line x1="1050" y1="0" x2="1050" y2="1200"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="0" y1="900" x2="1200" y2="900"/>
    <line x1="0" y1="1050" x2="1200" y2="1050"/>
  </g>

  <!-- visual center piece -->
  <g transform="translate(600, 520)">
    
    <!-- process steps -->
    <rect x="-300" y="-70" width="180" height="120" rx="18" fill="#1e3a8a" filter="url(#softShadow)"/>
    <rect x="-90" y="-70" width="180" height="120" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
    <rect x="120" y="-70" width="140" height="120" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="16 12"/>

    <text x="-210" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="white">Step 1</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#475569">Step 2</text>
    <text x="190" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="600" fill="#94a3b8">Broken</text>

    <!-- arrows between steps -->
    <g stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-110 -10 L-100 -10 L-100 10 L-90 10"/>
      <path d="M100 -10 L110 -10 L110 10 L120 10"/>
    </g>

    <!-- person caught in the middle -->
    <circle cx="0" cy="180" r="40" fill="#6366f1"/>
    <path d="M-45 250 Q0 210 45 250" stroke="#6366f1" stroke-width="16" stroke-linecap="round" fill="none"/>
    <text x="0" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="600" fill="#64748b">Redesign first</text>
  </g>

  <!-- brand mark top left -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="84" height="84" rx="18" fill="#1e3a8a"/>
    <text x="42" y="58" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="42" font-weight="700" fill="white">K°</text>
  </g>

  <!-- issue number top right -->
  <g transform="translate(1012, 80)">
    <rect x="0" y="0" width="140" height="56" rx="12" fill="#1e3a8a" fill-opacity="0.08" stroke="#1e3a8a" stroke-width="2" stroke-opacity="0.2"/>
    <text x="70" y="36" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" font-weight="600" fill="#1e3a8a">Issue 001</text>
  </g>

  <!-- title at bottom -->
  <g transform="translate(120, 940)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Most Roles Are</text>
    <text x="0" y="95" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Inherited, Not</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">Designed</text>
  </g>

  <!-- brand URL bottom right -->
  <text x="1116" y="1150" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="24" font-weight="500" fill="#64748b">kyleyuen.com/ideas</text>
</svg>