<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="workBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#workBg)"/>

  <!-- subtle grid -->
  <g stroke="white" stroke-width="1" stroke-opacity="0.08">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(120, 70)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="white" fill-opacity="0.1"/>
    <text x="28" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="white">K°</text>
  </g>

  <!-- title -->
  <text x="120" y="470" font-family="Inter, sans-serif" font-size="62" font-weight="900" fill="white" letter-spacing="-0.03em">Teams Phone + Mobile</text>

  <!-- subtitle -->
  <text x="120" y="545" font-family="Inter, sans-serif" font-size="30" font-weight="500" fill="#94a3b8">One number across office and field</text>

  <!-- footer -->
  <text x="120" y="720" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#64748b">Kyle Yuen · kyleyuen.com/work</text>
</svg>